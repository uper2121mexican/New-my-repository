<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ゲーム貸出システム</title>
  <style>
    :root { --bg: #f8f9fa; --primary: #0d6efd; --danger: #dc3545; --success: #198754; --text: #212529; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); max-width: 500px; margin: 0 auto; padding: 20px; }
    .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
    button { width: 100%; padding: 15px; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; transition: 0.2s; }
    .btn-connect { background: var(--primary); color: white; }
    .btn-connect:disabled { background: #6c757d; cursor: not-allowed; }
    .status { text-align: center; margin-top: 15px; font-weight: bold; }
    .list-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #dee2e6; }
    .btn-return { background: var(--danger); color: white; width: auto; padding: 8px 16px; font-size: 14px; }
    .log-window { background: #212529; color: #20c997; font-family: monospace; font-size: 12px; padding: 12px; border-radius: 8px; height: 150px; overflow-y: auto; white-space: pre-wrap; }
  </style>
</head>
<body>

  <h2 style="text-align: center;">🎮 ゲーム貸出システム</h2>

  <div class="card">
    <button id="btnConnect" class="btn-connect">リーダーを接続する</button>
    <div id="statusText" class="status" style="color: #6c757d;">待機中...</div>
  </div>

  <div class="card">
    <h3 style="margin-top: 0; border-bottom: 2px solid #dee2e6; padding-bottom: 10px;">貸出中 (<span id="count">0</span>件)</h3>
    <div id="lendList"></div>
  </div>

  <div class="card">
    <div class="log-window" id="logBox">システム起動完了。</div>
  </div>

  <script>
    // --- 1. アプリケーション状態管理 ---
    const AppState = {
      items: JSON.parse(localStorage.getItem('lendItems')) || [],
      save() { localStorage.setItem('lendItems', JSON.stringify(this.items)); },
      toggleItem(id) {
        const index = this.items.findIndex(i => i.id === id);
        if (index >= 0) {
          this.items.splice(index, 1);
          UI.log(`[返却] ID: ${id}`);
        } else {
          this.items.push({ id, date: new Date().toLocaleString() });
          UI.log(`[貸出] ID: ${id}`);
        }
        this.save();
        UI.renderList();
      }
    };

    // --- 2. UI制御 ---
    const UI = {
      log(msg) {
        const box = document.getElementById('logBox');
        const time = new Date().toLocaleTimeString();
        box.textContent = `[${time}] ${msg}\n` + box.textContent;
      },
      setStatus(msg, color) {
        const el = document.getElementById('statusText');
        el.textContent = msg;
        el.style.color = color;
      },
      renderList() {
        const listEl = document.getElementById('lendList');
        document.getElementById('count').textContent = AppState.items.length;
        listEl.innerHTML = AppState.items.length === 0 
          ? '<div style="text-align:center; color:#6c757d; margin-top:20px;">貸出中のアイテムはありません</div>'
          : '';
        
        AppState.items.forEach(item => {
          const div = document.createElement('div');
          div.className = 'list-item';
          div.innerHTML = `
            <div>
              <strong>ID: ${item.id}</strong><br>
              <small style="color:#6c757d;">${item.date}</small>
            </div>
            <button class="btn-return" onclick="AppState.toggleItem('${item.id}')">返却</button>
          `;
          listEl.appendChild(div);
        });
      }
    };

    // --- 3. PaSoRi ハードウェア制御クラス ---
    class PasoriReader {
      constructor() {
        this.device = null;
        this.epIn = 1;
        this.epOut = 2;
        this.lastId = '';
        this.lastReadTime = 0;
      }

      buildPacket(cmdData) {
        const len = cmdData.length;
        let sum = 0;
        for (let i = 0; i < len; i++) sum += cmdData[i];
        
        const pkt = new Uint8Array(6 + len + 2);
        pkt[0] = 0x00; pkt[1] = 0x00; pkt[2] = 0xff;
        pkt[3] = len; pkt[4] = (256 - len) & 0xff;
        pkt.set(cmdData, 5);
        pkt[5 + len] = (256 - (sum & 0xff)) & 0xff;
        pkt[6 + len] = 0x00;
        return pkt;
      }

      async sendCommand(cmd, name) {
        try {
          await this.device.transferOut(this.epOut, this.buildPacket(cmd));
          
          // 応答を待機（ACK または データ本体）
          let res = await this.device.transferIn(this.epIn, 64);
          let data = new Uint8Array(res.data.buffer);
          
          // ACK(00 00 ff 00 ff 00) の場合は本データを受信し直す
          if (data.length === 6 && data[2] === 0xff) {
            res = await this.device.transferIn(this.epIn, 64);
            data = new Uint8Array(res.data.buffer);
          }
          UI.log(`CMD(${name}): OK`);
          return data;
        } catch (e) {
          UI.log(`CMD(${name}): 失敗 (${e.message})`);
          return null;
        }
      }

      async connect() {
        try {
          UI.log("デバイス選択の待機中...");
          this.device = await navigator.usb.requestDevice({ filters: [{ vendorId: 0x054c, productId: 0x06c1 }] });
          await this.device.open();
          await this.device.selectConfiguration(1);
          await this.device.claimInterface(0);

          // エンドポイント走査
          for (let ep of this.device.configuration.interfaces[0].alternate.endpoints) {
            if (ep.direction === 'in') this.epIn = ep.endpointNumber;
            if (ep.direction === 'out') this.epOut = ep.endpointNumber;
          }
          
          UI.setStatus("PaSoRiの初期化中...", "var(--primary)");

          // ダミーパケットで通信の詰まりをリセット
          try { await this.device.transferOut(this.epOut, new Uint8Array([0x00,0x00,0xff,0x00,0xff,0x00])); } catch(e){}

          // 初期化シーケンス
          const r1 = await this.sendCommand([0xd6, 0x00], "Reset");
          if (!r1) throw new Error("OSにブロックされています(Zadigが必要です)");
          
          await this.sendCommand([0xd6, 0x02, 0x00, 0x18], "SetCmdType");
          await this.sendCommand([0xd6, 0x06, 0x00], "CarrierON");

          UI.setStatus("🟢 カードをかざしてください", "var(--success)");
          document.getElementById('btnConnect').disabled = true;
          this.poll();

        } catch (e) {
          UI.log("エラー: " + e.message);
          UI.setStatus("接続失敗: " + e.message, "var(--danger)");
        }
      }

      async poll() {
        while (this.device && this.device.opened) {
          // FeliCa Polling
          const res = await this.sendCommand([0xd6, 0x20, 0x01, 0x00, 0x00, 0xff, 0xff, 0x01, 0x00], "Poll");
          
          if (res && res.length > 18 && res[5] === 0xd7) {
            const idm = Array.from(res.slice(11, 19)).map(b => b.toString(16).padStart(2, '0')).join('').toUpperCase();
            
            const now = Date.now();
            if (idm !== "0000000000000000" && (idm !== this.lastId || now - this.lastReadTime > 2000)) {
              this.lastId = idm;
              this.lastReadTime = now;
              AppState.toggleItem(idm);
            }
          }
          // 次の読み取りまで少し待機
          await new Promise(r => setTimeout(r, 250));
        }
      }
    }

    // --- 4. 起動処理 ---
    UI.renderList();
    const reader = new PasoriReader();
    document.getElementById('btnConnect').addEventListener('click', () => reader.connect());

  </script>
</body>
</html>
